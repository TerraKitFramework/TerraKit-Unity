name: Release Unity Package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: unity-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish Unity release
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag on main and matching package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'Release tags must point to commits already merged into main' >&2
            exit 1
          }
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Expected tag v$version, got $RELEASE_TAG" >&2
            exit 1
          }

      - name: Run packaging tests
        run: python3 -m unittest discover -s tests -v

      - name: Build UPM tarball using pinned upstream binaries
        env:
          GH_TOKEN: ${{ secrets.TERRAKIT_RELEASE_TOKEN || github.token }}
        run: python3 scripts/package_terrakit.py --output dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(python3 -c 'import json; p=json.load(open("terrakit-version.json")); print(p["repository"] + "@terrakit-v" + p["version"])')"
          printf 'Unity UPM package built with native TerraKit %s.\n\nDownload the .tgz file and install from a local tarball in Unity Package Manager.\n' "$upstream" > notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace an immutable release." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.tgz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "TerraKit Unity $RELEASE_TAG" \
            --notes-file notes.md \
            --verify-tag
